name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goget_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/goget_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: make test-coverage

      - name: Run linting
        run: make lint

      - name: Build
        run: make build-all
  publish-image:
    needs: test-go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps: 
      - uses: actions/checkout@v4 

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with: 
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push to ECR
        uses: docker/build-push-action@v7
        with: 
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/gogate-dev/gateway:${{ github.sha }}
  update-manifest:
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Update gateway image tag
        id: update-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$IMAGE_TAG" ]; then
            echo "Main has advanced; skipping this older build."
            exit 0
          fi

          sed -i -E \
            "s|^([[:space:]]*image: )798644229154\.dkr\.ecr\.us-east-1\.amazonaws\.com/gogate-dev/gateway:[^[:space:]]+|\1798644229154.dkr.ecr.us-east-1.amazonaws.com/gogate-dev/gateway:${IMAGE_TAG}|" \
            deploy/k8s/gateway.yaml

          if git diff --quiet -- deploy/k8s/gateway.yaml; then
            echo "No image change needed."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit and push image update
        if: steps.update-image.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/k8s/gateway.yaml
          git commit -m "Deploy gateway image ${GITHUB_SHA}"
          git push origin HEAD:main