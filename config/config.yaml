# Shared by local Go, Docker Compose, and the container image.
# Secrets and connection URLs come from environment variables; see .env.example.
# Unspecified settings use Go defaults. Unknown YAML keys are rejected.

server:
  read_timeout: 60s
  write_timeout: 60s

cache:
  enabled: true
  ttl: 5m

rate_limit:
  global_rpm: 1000
  chat_completions_rpm: 500
  completions_rpm: 500
  embeddings_rpm: 1000

router:
  routing_strategy: priority

model_list:
  - model_name: gemini-flash
    provider:
      type: openai
      model: gemini-3.5-flash
      api_key: ${GEMINI_API_KEY}
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
  
  - model_name: gemini-flash-lite
    provider:
      type: openai
      model: gemini-3.1-flash-lite
      api_key: ${GEMINI_API_KEY}
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
